<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room Status</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0e0e0e;--ink:#fff;--mute:#a3a3a3;--line:#3a3a3a;--wall:#d4d4d4;
--vacant:#3ddc77;--occupied:#ffd84a;--dirty:#ff5b5b;--cleaning:#ff5b5b;--ooo:#9a9a9a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:16px 24px 6px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.who{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dirty);display:inline-block;margin-right:5px}
.dot.on{background:var(--vacant)}
.link{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--ink)}
input,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 24px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding:8px 24px 28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:8px 14px 24px}header,.chips{padding-left:14px;padding-right:14px}}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .gap{flex:1}
.plan{background:var(--panel);border:2px solid var(--wall);border-radius:6px;padding:14px;display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr)) 64px;grid-template-rows:auto 44px auto;gap:6px}
.core{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:4px;padding:4px}
.hall{grid-column:2/7;grid-row:2;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.hall span{background:var(--panel);padding:0 10px}
.room{min-height:96px;padding:8px 8px 8px 12px;text-align:left;position:relative;background:color-mix(in srgb,var(--c) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-left:6px solid var(--c);border-radius:4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .15s,transform .15s}
.room:hover{transform:translateY(-2px)}
.room[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.room.dim{opacity:.22}
.room .n{font-size:20px;font-weight:700}.room .t{font-size:12px;color:var(--mute)}
.room .g{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .ic{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;color:var(--c)}
.hint{margin-top:10px;font-size:13px;color:var(--mute)}
aside,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
aside{position:sticky;top:12px}
aside h2{margin:0;font-size:24px}.sub{color:var(--mute);margin:0 0 10px}
.pill{display:inline-flex;gap:6px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,var(--panel));color:var(--ink);font-weight:700;font-size:13px;border:1px solid var(--c)}
.view{width:100%;height:auto;margin:12px 0;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.seg button{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.seg i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.seg button[aria-pressed=true]{outline:2px solid var(--ink)}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.go{padding:9px 14px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
textarea{width:100%;min-height:56px;resize:vertical}
.stay{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0}.stay dt{color:var(--mute)}.stay dd{margin:0;font-weight:500}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:13px;max-height:180px;overflow:auto}
.log li{padding:5px 0;border-top:1px solid var(--line)}.log b{font-weight:700}.log .tm{color:var(--mute)}
.log .msg{color:var(--ink)}.log .st{color:var(--mute)}
.empty{color:var(--mute);padding:30px 6px;text-align:center}
.hk{display:grid;gap:12px}
.hk h3{margin:14px 0 0;font-size:15px;color:var(--mute)}
.hkc{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-left:8px solid var(--c);padding:14px 16px}
.hkc .n{font-size:26px;font-weight:700}.hkc .mute{color:var(--mute);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .go{padding:12px 16px}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login .card{display:grid;gap:10px}
.err{color:var(--dirty);font-size:14px;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
:focus-visible{outline:3px solid var(--occupied);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <h1>Room Status<small>Sign in with your hotel account</small></h1><br>
  <form class="card" id="lf">
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="go" type="submit">Sign in</button>
    <div class="err" id="le"></div>
  </form>
</div>
<div id="app" hidden>
  <header>
    <h1 id="title"></h1>
    <div class="who"><span><i class="dot" id="live"></i><span id="livet">Connecting</span></span><span id="me"></span><input id="q" type="search" placeholder="Find a room or guest" aria-label="Find a room or guest"><button class="link" id="out">Sign out</button></div>
  </header>
  <div class="chips" id="chips"></div>
  <main>
    <section>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="plan" class="plan"></div>
      <div id="hk" class="hk" hidden></div>
      <p class="hint" id="hint">Select a room to see its layout, change its status, or message the team.</p>
    </section>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>
<div id="toast" hidden></div>
<script>
const SB_URL='https://afsrhhmluryouwuzqyqn.supabase.co';
const SB_KEY='sb_publishable_C90uGSdJMCC5mH2dafxPQg_vNTIc-ep';
const sb=supabase.createClient(SB_URL,SB_KEY);
const ST={
 ready:{label:'Ready',c:'var(--vacant)',ic:'✓'},
 dueout:{label:'Due out',c:'var(--occupied)',ic:'→'},
 cleaning:{label:'Cleaning',c:'var(--cleaning)',ic:'◐'},
 oos:{label:'Out of service',c:'var(--ooo)',ic:'✕'}};
const DB2UI={vacant:'ready',occupied:'dueout',dirty:'cleaning',cleaning:'cleaning',ooo:'oos'};
const UI2DB={ready:'vacant',cleaning:'dirty',oos:'ooo'};
const disp=r=>DB2UI[r.status];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const fmtD=s=>s?new Date(s+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'';
const fmtT=s=>new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
let me=null,hotel=null,rooms=[],events=[],staff={},view='plan',floor=1,sel=null,filter=null,query='',chan=null;

function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
function show(id){$('login').hidden=id!=='login';$('app').hidden=id!=='app'}

$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';
 const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(error)$('le').textContent=error.message;else boot()};
$('out').onclick=async()=>{if(chan)sb.removeChannel(chan);await sb.auth.signOut();show('login')};

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return show('login');
 const [p,h,r,e]=await Promise.all([
  sb.from('profiles').select('*'),sb.from('hotels').select('*').limit(1),
  sb.from('rooms').select('*').order('number'),
  sb.from('room_events').select('*').order('created_at',{ascending:false}).limit(300)]);
 const err=p.error||h.error||r.error||e.error;
 if(err){toast(err.message);return show('login')}
 p.data.forEach(x=>staff[x.id]=x);
 me=staff[session.user.id];
 if(!me){$('le').textContent='This account isn’t linked to a hotel yet. Ask your manager to add you.';await sb.auth.signOut();return show('login')}
 hotel=h.data[0];rooms=r.data;events=e.data;
 view=me.role==='housekeeping'?'hk':'plan';
 $('title').innerHTML=esc(hotel.name)+'<small>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</small>';
 $('me').textContent=me.name+' · '+me.role.replace('_',' ');
 show('app');renderAll();listen()}

function listen(){
 if(chan)sb.removeChannel(chan);
 chan=sb.channel('hotel-'+hotel.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'rooms'},p=>{
   if(p.eventType==='DELETE')rooms=rooms.filter(x=>x.id!==p.old.id);
   else{const i=rooms.findIndex(x=>x.id===p.new.id);if(i<0)rooms.push(p.new);else rooms[i]=p.new}
   renderAll(true)})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'room_events'},p=>{
   if(!events.some(x=>x.id===p.new.id))events.unshift(p.new);renderAll(true)})
  .subscribe(s=>{const on=s==='SUBSCRIBED';$('live').className='dot'+(on?' on':'');$('livet').textContent=on?'Live':'Reconnecting'})}

async function setRoom(r,patch,msg){
 Object.assign(r,patch);renderAll();
 const {error}=await sb.from('rooms').update(patch).eq('id',r.id);
 if(error){toast(error.message);boot();return}
 if(msg)say(r,msg)}
async function say(r,text){
 const {error}=await sb.from('room_events').insert({hotel_id:me.hotel_id,room_id:r.id,user_id:me.id,kind:'message',message:text});
 if(error)toast(error.message)}

function matches(r){
 if(filter&&disp(r)!==filter)return false;
 if(query){const q=query.toLowerCase();return r.number.includes(q)||r.guest.toLowerCase().includes(q)}
 return true}

function renderAll(keepTyping){
 renderChips();renderTabs();
 $('plan').hidden=view!=='plan';$('hk').hidden=view!=='hk';$('hint').hidden=view!=='plan';
 if(view==='plan')renderPlan();else renderHK();
 if(!(keepTyping&&document.activeElement&&['nt','mt','gn'].includes(document.activeElement.id)))renderPanel()}

function renderChips(){
 $('chips').innerHTML=Object.entries(ST).map(([k,v])=>`<button class="chip" style="--c:${v.c}" data-k="${k}" aria-pressed="${filter===k}"><i></i>${v.label} <b>${rooms.filter(r=>disp(r)===k).length}</b></button>`).join('');
 $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=filter===b.dataset.k?null:b.dataset.k;renderAll()})}

function renderTabs(){
 const floors=[...new Set(rooms.map(r=>r.floor))].sort((a,b)=>a-b);
 let h='';
 if(me.role!=='housekeeping')h+=floors.map(f=>{const n=rooms.filter(r=>r.floor===f&&disp(r)==='cleaning').length;
  return `<button role="tab" data-f="${f}" aria-selected="${view==='plan'&&f===floor}">Floor ${f}${n?` <b style="color:var(--dirty)">${n}</b>`:''}</button>`}).join('');
 const todo=rooms.filter(r=>disp(r)==='cleaning').length;
 h+=`<span class="gap"></span><button role="tab" data-f="hk" aria-selected="${view==='hk'}">Housekeeping list (${todo})</button>`;
 $('tabs').innerHTML=h;
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(b.dataset.f==='hk')view='hk';else{view='plan';floor=+b.dataset.f}renderAll()})}

function renderPlan(){
 const idx=r=>parseInt(r.number)-r.floor*100;
 const tile=r=>{const v=ST[disp(r)];
  return `<button class="room${matches(r)?'':' dim'}" style="--c:${v.c}" data-id="${r.id}" aria-pressed="${sel===r.id}" aria-label="Room ${esc(r.number)}, ${esc(r.type)}, ${v.label}${r.guest?', '+esc(r.guest):''}">
  <span class="ic" aria-hidden="true">${v.ic}</span><span><span class="n">${esc(r.number)}</span><br><span class="t">${esc(r.type)}</span></span><span class="g">${esc(r.guest)||v.label}</span></button>`};
 const fr=rooms.filter(r=>r.floor===floor);
 const wrap=(h,row)=>`<div style="grid-column:2/7;grid-row:${row};display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">${h}</div>`;
 $('plan').innerHTML=`<div class="core" style="grid-column:1;grid-row:1/4">Lifts<br>Stairs</div>${wrap(fr.filter(r=>idx(r)<=5).map(tile).join(''),1)}<div class="hall"><span>Corridor</span></div>${wrap(fr.filter(r=>idx(r)>5).map(tile).join(''),3)}<div class="core" style="grid-column:7;grid-row:1/4">Linen<br>Ice</div>`;
 $('plan').querySelectorAll('.room').forEach(b=>b.onclick=()=>{sel=b.dataset.id;renderAll();if(matchMedia('(max-width:900px)').matches)$('panel').scrollIntoView({behavior:'smooth',block:'start'})})}

function lastMsg(r){return events.find(e=>e.room_id===r.id&&e.kind==='message')}
function renderHK(){
 const list=rooms.filter(r=>disp(r)==='cleaning').sort((a,b)=>a.floor-b.floor||a.number.localeCompare(b.number));
 if(!list.length){$('hk').innerHTML='<div class="card empty">Nothing to clean right now. New checkouts will appear here instantly.</div>';return}
 let h='',f=null;
 list.forEach(r=>{
  if(r.floor!==f){f=r.floor;h+=`<h3>Floor ${f}</h3>`}
  const v=ST[disp(r)],m=lastMsg(r);
  h+=`<div class="card hkc" style="--c:${v.c}"><div><span class="n">${esc(r.number)}</span> <span class="mute">${esc(r.type)} · ${v.label}</span>
   ${r.note?`<div class="mute">Note: ${esc(r.note)}</div>`:''}${m?`<div class="mute">“${esc(m.message)}” – ${esc(staff[m.user_id]?.name||'Staff')}</div>`:''}</div>
   <div class="acts"><button class="go" data-a="done" data-id="${r.id}">Mark clean</button>
   <button class="go alt" data-a="msg" data-id="${r.id}">Message</button><button class="go alt" data-a="ooo" data-id="${r.id}">Report problem</button></div></div>`});
 $('hk').innerHTML=h}
$('hk').onclick=e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const r=rooms.find(x=>x.id===b.dataset.id),a=b.dataset.a;
 if(a==='done')setRoom(r,{status:'vacant'});
 if(a==='msg'){const t=prompt('Message for room '+r.number+':');if(t&&t.trim())say(r,t.trim())}
 if(a==='ooo'){const t=prompt('What’s the problem in room '+r.number+'?');if(t&&t.trim())setRoom(r,{status:'ooo',note:t.trim()},'Problem reported: '+t.trim())}}

function roomSVG(r){
 const c=ST[disp(r)].c,w='stroke="var(--wall)" stroke-width="3"',f='fill="var(--bg)" stroke="var(--wall)" stroke-width="1.5"';
 const bed=(x,y,wd,h)=>`<rect x="${x}" y="${y}" width="${wd}" height="${h}" rx="4" ${f}/><rect x="${x+4}" y="${y+4}" width="${wd-8}" height="12" rx="3" fill="var(--line)"/>`;
 const bath=(x,y,wd,h,l=1)=>`<rect x="${x}" y="${y}" width="${wd}" height="${h}" ${f}/><circle cx="${x+14}" cy="${y+h-16}" r="8" ${f}/><rect x="${x+wd-30}" y="${y+6}" width="24" height="${Math.min(40,h-12)}" rx="3" ${f}/>${l?`<text x="${x+wd/2}" y="${y+14}" font-size="9" text-anchor="middle" fill="var(--mute)">Bath</text>`:''}`;
 const desk=`<rect x="170" y="112" width="58" height="22" rx="3" ${f}/><text x="199" y="127" font-size="9" text-anchor="middle" fill="var(--mute)">Desk</text>`;
 let i;
 if(r.type==='King')i=bed(60,16,76,86)+`<rect x="44" y="20" width="12" height="14" ${f}/><rect x="140" y="20" width="12" height="14" ${f}/>`+bath(166,12,68,64)+desk;
 else if(r.type==='Double queen')i=bed(24,16,62,84)+bed(96,16,62,84)+bath(170,12,64,64)+desk;
 else i=`<line x1="124" y1="10" x2="124" y2="95" ${w}/><line x1="124" y1="125" x2="124" y2="150" ${w}/><rect x="22" y="22" width="70" height="26" rx="6" ${f}/><rect x="40" y="76" width="34" height="22" rx="3" ${f}/><text x="57" y="90" font-size="9" text-anchor="middle" fill="var(--mute)">Table</text><text x="60" y="130" font-size="10" text-anchor="middle" fill="var(--mute)">Living</text>`+bed(138,14,64,76)+bath(208,12,34,64,0)+`<text x="190" y="130" font-size="10" text-anchor="middle" fill="var(--mute)">Bedroom</text>`;
 return `<svg class="view" viewBox="0 0 250 160" role="img" aria-label="Layout of room ${esc(r.number)}"><rect x="8" y="8" width="234" height="144" fill="${c}" fill-opacity=".13" ${w}/><path d="M30 152 L30 128 A24 24 0 0 1 54 152" fill="none" stroke="var(--mute)" stroke-width="1.5"/>${i}</svg>`}

function logHTML(r){
 const ev=events.filter(e=>e.room_id===r.id).slice(0,12);
 if(!ev.length)return '<p class="hint">No activity yet.</p>';
 return '<ul class="log">'+ev.map(e=>{
  const who=esc(staff[e.user_id]?.name||'Staff');
  const txt=e.kind==='status'?'<span class="st">'+e.message.split(' -> ').map(k=>ST[DB2UI[k]]?.label||k).join(' → ')+'</span>':'<span class="msg">'+esc(e.message)+'</span>';
  return `<li><span class="tm">${fmtT(e.created_at)}</span> <b>${who}</b> ${txt}</li>`}).join('')+'</ul>'}

function renderPanel(){
 const p=$('panel'),r=rooms.find(x=>x.id===sel);
 if(!r){p.innerHTML='<div class="empty">Select a room to see its layout, status and messages.</div>';return}
 const v=ST[disp(r)];let stay='';
 if(r.status==='occupied')stay=`<dl class="stay"><dt>Guest</dt><dd>${esc(r.guest)}</dd><dt>Arrived</dt><dd>${fmtD(r.check_in)}</dd><dt>Departs</dt><dd>${fmtD(r.check_out)}</dd></dl><button class="go alt" id="co">Check out guest</button>`;
 else if(r.status==='vacant')stay=`<label for="gn">Check in a guest</label><div class="row"><input id="gn" placeholder="Guest surname"><button class="go" id="ci">Check in</button></div>`;
 p.innerHTML=`<h2>Room ${esc(r.number)}</h2><p class="sub">Floor ${r.floor} · ${esc(r.type)}</p><span class="pill" style="--c:${v.c}">${v.ic} ${v.label}</span>${roomSVG(r)}${stay}
 <label>Set status</label><div class="seg">${Object.entries(ST).filter(([k])=>k!=='dueout').map(([k,s])=>`<button style="--c:${s.c}" data-k="${k}" aria-pressed="${disp(r)===k}"><i></i>${s.label}</button>`).join('')}</div>
 <label for="nt">Room note</label><textarea id="nt">${esc(r.note)}</textarea>
 <label for="mt">Message the team about this room</label><div class="row"><input id="mt" placeholder="e.g. Early check-in, please prioritize"><button class="go" id="send">Send</button></div>${logHTML(r)}`;
 p.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  if(r.status==='occupied'&&!confirm('This room has a guest. Change its status anyway?'))return;
  const k=b.dataset.k;setRoom(r,{status:UI2DB[k],...(r.status==='occupied'?{guest:'',check_in:null,check_out:null}:{})})});
 const ci=$('ci');if(ci)ci.onclick=()=>{const g=$('gn').value.trim();if(!g)return $('gn').focus();setRoom(r,{status:'occupied',guest:g,check_in:iso(0),check_out:iso(2)})};
 const co=$('co');if(co)co.onclick=()=>setRoom(r,{status:'dirty',guest:'',check_in:null,check_out:null});
 $('nt').onchange=e=>setRoom(r,{note:e.target.value});
 const send=()=>{const t=$('mt').value.trim();if(t){$('mt').value='';say(r,t)}};
 $('send').onclick=send;$('mt').onkeydown=e=>{if(e.key==='Enter')send()}}
